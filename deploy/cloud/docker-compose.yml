# 自有餐饮 POS —— 云端一键部署（服务端 + MySQL + Nginx）
#
#   cd pos/deploy/cloud
#   cp .env.example .env      # 改密码与域名
#   docker compose up -d
#
# 首次启动会自动建表 + 灌演示数据 + 导出商品 CSV。
# 改完 .env 里 CLIENT_API_BASE 后，把它写进 Windows 客户端的 appsettings.json。

services:
  mysql:
    image: mysql:8.0
    container_name: pos-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --max_connections=500
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [pos-net]

  pos-server:
    build: .
    image: yihua/pos-server:1.0
    container_name: pos-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DSH_POS_DB: "mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}?charset=utf8mb4"
      DSH_POS_JWT_SECRET: ${JWT_SECRET}
      DSH_POS_DATA: /data
      DSH_POS_OSS_BASE: "${CLIENT_API_BASE}/oss/"
    volumes:
      - pos-data:/data
    networks: [pos-net]

  nginx:
    image: nginx:1.27-alpine
    container_name: pos-nginx
    restart: unless-stopped
    depends_on: [pos-server]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks: [pos-net]

volumes:
  mysql-data:
  pos-data:

networks:
  pos-net:
    driver: bridge
